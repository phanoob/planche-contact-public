[package]
name = "planche-contact"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
lcms2 = "6"
pdf-writer = "0.15.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
default = []
# Version portable : réglages à côté de l'exe.
portable = []

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Pdf", "Storage", "Storage_Streams", "Foundation"] }
